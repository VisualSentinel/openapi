                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Alert acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
  /api/alerts/{id}/resolve:
    post:
      tags:
      - Alerts
      summary: Resolve alert
      description: Mark an alert as resolved.
      operationId: resolveAlert
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Alert resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
  /api/alerts/pause-all:
    post:
      tags:
      - Alerts
      summary: Pause all alerts
      description: Pause or resume all alerting for the organization. While paused, no notification channel receives alerts;
        alerts still appear in the dashboard. Each channel keeps its own on or off setting, so resuming does not turn on a
        channel that was switched off.
      operationId: pauseAllAlerts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - paused
              properties:
                paused:
                  type: boolean
      responses:
        '200':
          description: Alerts paused or resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  paused:
                    type: boolean
                  pausedAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  channelsUpdated:
                    type: integer
                  message:
                    type: string
    get:
      tags:
      - Alerts
      summary: Get alerts paused status
      description: Check whether all alerts are currently paused.
      operationId: getAlertsPausedStatus
      responses:
        '200':
          description: Paused status
          content:
            application/json:
              schema:
                type: object
                properties:
                  paused:
                    type: boolean
                  pausedAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  partiallyPaused:
                    type: boolean
                    description: Alerts are not paused, but some channels are switched off.
  /api/alert-rules:
    get:
      tags:
      - Alert Rules
      summary: List alert rules
      description: Get all alert rules for the organization. Each rule carries supported and unsupportedReason; unsupported
        rules are never evaluated.
      operationId: listAlertRules
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: List of alert rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleListResponse'
    post:
      tags:
      - Alert Rules
      summary: Create alert rule
      description: Create a rule that alerts when one monitor's response time or uptime crosses a threshold. monitorId is
        required. Down alerts, repeated failures and SSL expiry are built-in alerts, so rules do not accept those conditions.
      operationId: createAlertRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertRuleRequest'
      responses:
        '201':
          description: Alert rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleResponse'
        '400':
          description: Validation failed, or the request uses a condition alert rules do not support (status_change, consecutive_failures,
            ssl_expiry). Those are covered by the built-in alerts.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AlertRuleConditionNotSupportedResponse'
                - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Monitor not found in this organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/alert-rules/{id}:
    get:
      tags:
      - Alert Rules
      summary: Get alert rule
