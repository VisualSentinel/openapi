                  type: array
                  description: Monitor IDs. Duplicates are collapsed; IDs that are not monitors of your organization are reported
                    in `skipped` with the reason "Monitor not found."
                  items:
                    type: string
                    format: uuid
                  minItems: 1
                  maxItems: 2000
      responses:
        '200':
          description: Processed. `unchanged` is always empty here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorBulkResult'
        '400':
          description: Body is missing or not JSON, or fails validation. `details` holds `formErrors` and `fieldErrors`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in, or no valid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Developer, Member or Viewer role, paused seat (code `SEAT_PAUSED_BY_PLAN`), missing or invalid CSRF
            token, no membership in the organization, or the API key lacks the `monitors:write` scope or plan API access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: More than 30 requests in a minute to this bulk route for the organization
          headers:
            Retry-After:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              description: ISO time the window resets.
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorBulkRateLimitError'
