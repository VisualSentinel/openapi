              type: integer
              minimum: 100
              maximum: 120000
            ttfb:
              type: integer
              minimum: 0
              maximum: 120000
            fcp:
              type: integer
              minimum: 0
              maximum: 120000
            lcp:
              type: integer
              minimum: 0
              maximum: 120000
            cls:
              type: number
              minimum: 0
              maximum: 10
          additionalProperties: false
          description: Performance budgets in milliseconds (`responseTime`, `ttfb`, `fcp`, `lcp`) and `cls`.
