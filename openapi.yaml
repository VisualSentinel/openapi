      tags:
      - Monitors
      summary: Delete a batch of monitors
      description: 'Deletes up to 2,000 monitors, each through the same rules as DELETE /api/monitors/{id}: checks stop at
        once and each monitor can be restored for 24 hours. Monitors that cannot be deleted are reported in `skipped` with
        the reason, so the request can partly succeed. Requires the Owner or Admin role; API keys need the `monitors:write`
        scope. Limited to 30 requests per minute per organization.'
      operationId: bulkRemoveMonitors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - monitorIds
              properties:
