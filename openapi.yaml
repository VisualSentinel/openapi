          type:
          - string
          - 'null'
          format: date-time
        locations:
          type: array
          items:
            $ref: '#/components/schemas/CheckRegion'
          description: Uptime check regions.
        regionChecks:
          type: array
          description: Latest authoritative check per configured canonical region. An empty array means no regional evidence
