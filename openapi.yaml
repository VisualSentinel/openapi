openapi: 3.1.0
info:
  title: Visual Sentinel API
  description: 'Website monitoring API with six layers: uptime, performance, SSL, DNS, visual change detection and content
    change detection.


    ## Authentication


    Endpoints accept either of two credentials unless an operation says otherwise.


    ### 1. Session cookie (web clients)

    Call `POST /api/auth/login` with email and password to get a session cookie. The cookie is sent automatically with later
    requests. Session writes are CSRF protected (send `X-CSRF-Token` on POST, PUT, PATCH and DELETE).


    ### 2. API key (agents, integrations, scripts)

    Owners and admins create keys in **Organization settings > Developer**. A key is `vs_` followed by 64 hexadecimal characters
    and is shown once. Send it as any of:

    - `Authorization: Bearer vs_...` header (recommended)

    - `X-API-Key: vs_...` header

    - `?api_key=vs_...` query parameter


    **API access requires the Business or Agency plan.** On other plans every key request returns 403 with code `API_ACCESS_NOT_IN_PLAN`.


    Scopes have the form `{resource}:{read|write}`:

    - GET requests need `{resource}:read`. POST, PUT, PATCH and DELETE need `{resource}:write`. In the dashboard, choosing
    write also grants read.

    - `{resource}:*` grants read and write on one resource. `*` grants every resource.

    - A missing scope returns 403 with code `SCOPE_DENIED` and names the scope the request needs.

    - Platform admin endpoints under `/api/admin/*` are blocked for API keys whatever the scope.

    - CSRF checks are skipped for API key requests.

    - The role of the member who created the key applies, so a key made by a viewer cannot write.


    Resources and the paths they cover:

    - `monitors`: `/api/monitors/*`, `/api/monitoring/*`, `/api/metrics/*`, `/api/dependencies/*`, `/api/reports/*`, `/api/dns/*`

    - `incidents`: `/api/incidents/*`

    - `servers`: `/api/servers/*` (the dashboard grants read only)

    - `status-pages`: `/api/status-pages/*`

    - `alerts`: `/api/alerts/*`, `/api/alert-rules/*`, `/api/alert-groups/*`

    - `channels`: `/api/notification-channels/*`, `/api/notifications/*`

    - `maintenance`: `/api/maintenance/*`

    - `organization`: `/api/organization/*`, `/api/settings/*`, `/api/plan`, `/api/integrations/*`

    - `user`: `/api/user/*`, `/api/profile/*`, `/api/onboarding/*`


    Other paths, for example `/api/overview`, `/api/workspace/*`, `/api/insights/*`, `/api/analytics/*` and `/api/billing/*`,
    resolve to the `general` resource and need a key with the `*` scope. The dashboard does not create `*` keys.


    ### Session-only endpoints (cookie required)

    These endpoints stay session-only by design. An API key on them returns 403 with code `SESSION_REQUIRED` (or 401 where
    no session exists):

    - `/api/auth/*` (login, logout, refresh, 2FA, password reset, OAuth)

    - `/api/billing/checkout`, `/api/billing/change-plan`, `/api/billing/portal` (billing changes)

    - `DELETE /api/organization`, member and invitation management under `/api/organization/members` and `/api/organization/invitations`,
    `POST/PUT/DELETE /api/organization/smtp`, `POST /api/organization/leave`, and `POST/PATCH/DELETE /api/api-keys` (account
    and access management)

    - `/api/integrations/slack/auth` (OAuth start)

    - `/api/organization/invitations/accept` (email link flow)

    - `/api/user/delete-account`

    - `/api/user/organizations/switch` (changes the session cookie)

    - `/api/chat/*`, `/api/ai/*`, `/api/incidents/{id}/summarize`, `/api/alert-groups/{id}/summarize`, `/api/reports/digest`,
    `POST /api/monitors/{id}/anomalies`, `POST /api/monitors/{id}/report` (AI and reporting features)


    ## Check regions


    Uptime checks for HTTP, HTTPS, KEYWORD, API and GRAPHQL monitors can run from `EU` (Europe), `US` (United States) and
    `ASIA` (Asia Pacific); other monitor types run from `EU`. Set them with `locations` on monitor create and update. Screenshots
    for visual checks are taken in `EU` or `ASIA` (`visualRegion`).


    Asia Pacific is enabled per workspace during its rollout. `GET /api/monitoring/regions` reports whether this workspace
    can use it. When it cannot, monitor create and update with `ASIA` return 400 with code `REGION_UNAVAILABLE`. A region
    outside your plan returns 403 with code `LOCATION_RESTRICTED`.


    ## Mobile apps (iOS, Android, Mac)


    Native apps can use the same login flow: `POST /api/auth/login` returns a JWT. Send it as `Authorization: Bearer <jwt>`
    on every later request. CSRF is skipped for Bearer tokens. Refresh tokens with `POST /api/auth/refresh`, passing the refresh
    token in the request body (or the `X-Client-Type: mobile` header).


    ## Rate limits


    - API keys: 1,000 requests per minute per key. Over the limit the API returns 429 with code `RATE_LIMIT` and a `Retry-After`
    header.

    - Login: 15 attempts per 5 minutes

    - Registration: 3 per hour

    - Monitor creation: 1,000 per hour per workspace

    - Alert rule creation: 20 per minute

    - Bulk monitor changes (`/api/monitors/bulk-*`): 30 per minute per workspace

    - Public tools (`/api/tools/*`): 10 per minute per IP address


    ## Base URL


    Production: `https://visualsentinel.com`'
  version: 2.215.0
  contact:
    name: Visual Sentinel Support
    url: https://visualsentinel.com/contact
    email: support@visualsentinel.com
  license:
    name: Proprietary
    url: https://visualsentinel.com/terms
servers:
- url: https://visualsentinel.com
  description: Production server
tags:
- name: System
  description: Health checks, metrics, and system status
- name: Authentication
  description: User authentication, sessions, OAuth, and 2FA
- name: Monitors
  description: Website and endpoint monitoring CRUD and operations
- name: Visual Monitoring
  description: Screenshot-based visual regression detection
- name: Servers
  description: Server infrastructure monitoring via agent
- name: Server Alerts
  description: Server alert history and configuration
- name: Notification Channels
  description: Manage notification destinations (email, Slack, Discord, etc.)
- name: Alerts
  description: Alert management, acknowledgment, and resolution
- name: Alert Rules
  description: Configure alerting conditions and thresholds
- name: Alert Groups
  description: Grouped alert management
- name: Incidents
  description: Incident tracking and management
- name: Status Pages
  description: Public status page management
- name: Teams
  description: Team management and member assignment
- name: Organization
  description: Organization settings, members, invitations, and branding
- name: Maintenance
  description: Scheduled maintenance windows
- name: Billing
  description: Subscription management and checkout
- name: Integrations
  description: Third-party integrations (Slack, Discord, PagerDuty, webhooks, Google)
- name: Tools
  description: Free public website checking tools
- name: Reports
  description: Report generation and digest emails. Workspace digest email AI summaries are optional, off by default, and
    added only when sending an opted-in digest on an eligible plan.
- name: Analytics
  description: Analytics, journeys, and subscription events
- name: Notifications
  description: In-app notification management
- name: User
  description: User profile and preferences
- name: Chat
  description: AI chat support system
- name: Onboarding
  description: User onboarding flow
- name: Settings
  description: Application settings (deduplication, reports)
- name: Public
  description: Unauthenticated public endpoints (blog, status pages, stats)
- name: Webhooks
  description: Incoming webhook handlers (Paddle, WhatsApp)
- name: API Keys
  description: API key management
paths:
  /api/health:
    get:
      tags:
      - System
      summary: Health check
      description: Returns system health status including database, cache, and worker connectivity.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: System healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/metrics:
    get:
      tags:
      - System
      summary: Prometheus metrics
      description: Get metrics in Prometheus format for external monitoring systems. Each API key can call this 12 times per
        minute, so use a scrape interval of 15 seconds or longer. Values can be up to 15 seconds old.
      operationId: getMetrics
      security:
      - ApiKeyAuth: []
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Invalid or missing API key
        '403':
          description: The key lacks the monitors:read scope, or the plan does not include API access
        '429':
          description: More than 12 requests in a minute for this API key. See the Retry-After header.
  /api/plan:
    get:
      tags:
      - System
      summary: Get current plan details
      description: Returns the current organization's plan, limits, and usage.
      operationId: getPlan
      responses:
        '200':
          description: Plan details
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    type: string
                  limits:
                    type: object
                  usage:
                    type: object
  /api/dns:
    get:
      tags:
      - System
      summary: DNS lookup
      description: Perform a DNS lookup for a given domain.
      operationId: dnsLookup
      parameters:
      - name: domain
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: DNS records
  /api/auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      description: Authenticate with email and password. Returns user data and sets session cookie.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many login attempts
  /api/auth/register:
    post:
      tags:
      - Authentication
      summary: Register new account
      description: Create a new user account and organization.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
        '409':
          description: Email already exists
  /api/auth/logout:
    post:
      tags:
      - Authentication
      summary: Logout
      description: End current session and clear cookies.
      operationId: logout
      responses:
        '200':
          description: Logged out successfully
      security:
      - SessionAuth: []
  /api/auth/me:
    get:
      tags:
      - Authentication
      summary: Get current user
      description: Returns the currently authenticated user's profile, organization, and permissions.
      operationId: getCurrentUser
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
      security:
      - SessionAuth: []
  /api/auth/csrf:
    get:
      tags:
      - Authentication
      summary: Get CSRF token
      description: Get a CSRF token for subsequent write operations. Required for session-based auth.
      operationId: getCsrfToken
      responses:
        '200':
          description: CSRF token
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrfToken:
                    type: string
      security:
      - SessionAuth: []
  /api/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Refresh session
      description: Refresh the current session token to extend its lifetime.
      operationId: refreshSession
      responses:
        '200':
          description: Session refreshed
        '401':
          description: Session expired
      security:
      - SessionAuth: []
  /api/auth/sessions:
    get:
      tags:
      - Authentication
      summary: List active sessions
      description: Get all active sessions for the current user.
      operationId: listSessions
      responses:
        '200':
          description: Active sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
    delete:
      tags:
      - Authentication
      summary: Revoke session
      description: Revoke a specific session by ID.
      operationId: revokeSession
      security:
      - SessionAuth: []
      responses:
        '200':
          description: Session revoked
  /api/auth/2fa:
    post:
      tags:
      - Authentication
      summary: Enable 2FA
      description: Generate a TOTP secret and QR code to enable two-factor authentication.
      operationId: enable2FA
      security:
      - SessionAuth: []
      responses:
        '200':
          description: 2FA setup data
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                  qrCode:
                    type: string
                    description: QR code for the authenticator app, as a self-contained image data URL (data:image/svg+xml;base64,...).
                  backupCodes:
                    type: array
                    items:
                      type: string
    put:
      tags:
      - Authentication
      summary: Confirm 2FA setup
      description: Confirm 2FA setup by providing a valid TOTP code.
      operationId: confirm2FA
      security:
      - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
      responses:
        '200':
          description: 2FA enabled
    delete:
      tags:
      - Authentication
      summary: Disable 2FA
      description: Disable two-factor authentication for the current user.
      operationId: disable2FA
      security:
      - SessionAuth: []
      responses:
        '200':
          description: 2FA disabled
  /api/auth/2fa/verify:
    post:
      tags:
      - Authentication
      summary: Verify 2FA code
      description: Verify a TOTP code during login when 2FA is enabled.
      operationId: verify2FA
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                tempToken:
                  type: string
      responses:
        '200':
          description: 2FA verified, session created
        '401':
          description: Invalid code
  /api/auth/forgot-password:
    post:
      tags:
      - Authentication
      summary: Request password reset
      description: Send a password reset email to the specified address.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent (always returns 200 to prevent enumeration)
    get:
      tags:
      - Authentication
      summary: Validate reset token
      description: Check if a password reset token is still valid.
      operationId: validateResetToken
      security: []
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Token is valid
        '400':
          description: Token expired or invalid
  /api/auth/reset-password:
    post:
      tags:
      - Authentication
      summary: Reset password
      description: Set a new password using a valid reset token.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password reset successful
        '400':
          description: Invalid or expired token
  /api/auth/update-password:
    post:
      tags:
      - Authentication
      summary: Update password
      description: Change the current user's password (requires current password).
      operationId: updatePassword
      security:
      - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - currentPassword
              - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Password updated
        '401':
          description: Current password incorrect
  /api/auth/verify-email:
    get:
      tags:
      - Authentication
      summary: Verify email (via link)
      description: Verify email address using the token from the verification email link.
      operationId: verifyEmailGet
      security: []
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Email verified
        '400':
          description: Invalid or expired token
    post:
      tags:
      - Authentication
      summary: Verify email (via code)
      description: Verify email address using a verification code.
      operationId: verifyEmailPost
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email verified
  /api/auth/resend-verification:
    post:
      tags:
      - Authentication
      summary: Resend verification email
      description: Resend the email verification link.
      operationId: resendVerification
      responses:
        '200':
          description: Verification email sent
      security:
      - SessionAuth: []
  /api/auth/oauth/providers:
    get:
      tags:
      - Authentication
      summary: List OAuth providers
      description: Get available OAuth providers (Google, GitHub).
      operationId: listOAuthProviders
      security: []
      responses:
        '200':
          description: Available providers
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        enabled:
                          type: boolean
  /api/auth/oauth/google:
    get:
      tags:
      - Authentication
      summary: Initiate Google OAuth
      description: Redirect to Google OAuth consent screen.
      operationId: googleOAuth
      security: []
      responses:
        '302':
          description: Redirect to Google
  /api/auth/oauth/google/callback:
    get:
      tags:
      - Authentication
      summary: Google OAuth callback
      description: Handle the Google OAuth callback after user consent.
      operationId: googleOAuthCallback
      security: []
      responses:
        '302':
          description: Redirect to dashboard
  /api/auth/oauth/github:
    get:
      tags:
      - Authentication
      summary: Initiate GitHub OAuth
      description: Redirect to GitHub OAuth consent screen.
      operationId: githubOAuth
      security: []
      responses:
        '302':
          description: Redirect to GitHub
  /api/auth/oauth/github/callback:
    get:
      tags:
      - Authentication
      summary: GitHub OAuth callback
      description: Handle the GitHub OAuth callback after user consent.
      operationId: githubOAuthCallback
      security: []
      responses:
        '302':
          description: Redirect to dashboard
  /api/monitors:
    get:
      tags:
      - Monitors
      summary: List monitors
      description: Get all monitors for the current organization with pagination and filtering.
      operationId: listMonitors
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          default: 1
          minimum: 1
        description: Page number. Results are paginated only when `page` is sent; otherwise up to 2,000 monitors are returned
          in one response.
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 100
      - name: status
        in: query
        schema:
          type: string
          enum:
          - all
          - operational
          - degraded
          - down
          - pending
          - changed
          - paused
        description: Filter by status. `all` (or no value) returns every monitor; `paused` returns paused monitors.
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - site
          - api
        description: Product-level one-tap scope. api includes API and GraphQL; site includes every other monitor type.
      - name: type
        in: query
        schema:
          type: string
        description: 'Filter by monitor type. One value or a comma-separated list, any case, for example `api,graphql`. Values:
          see StoredMonitorType.'
      - name: enabled
        in: query
        schema:
          type: boolean
      - name: search
        in: query
        schema:
          type: string
        description: Search by name or URL
      - name: tags
        in: query
        schema:
          type: string
        description: Comma-separated list of tags
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - createdAt
          - name
          - status
          - uptime
          default: createdAt
      - name: sortOrder
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: includeSummary
        in: query
        schema:
          type: boolean
          default: false
        description: On page 1, include exact fleet-wide status/type counts and average uptime without loading every monitor
          row.
      responses:
        '200':
          description: 'List of monitors. By default (no `page` query parameter) the response is a bare array of Monitor objects
            for backward compatibility. When the request sends `Accept: application/json` AND includes a `page` query parameter,
            the response is the `data`-wrapped paginated envelope shown below.'
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/Monitor'
                - $ref: '#/components/schemas/MonitorListResponse'
    post:
      tags:
      - Monitors
      summary: Create monitor
      description: Create a website or endpoint monitor. Uptime checks start right away. Use `locations` for check regions
        (EU, US, ASIA) and `visualEnabled` / `visualRegion` for screenshots.
      operationId: createMonitor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMonitorRequest'
      responses:
        '200':
          description: Monitor created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '400':
          description: Validation failed. Codes include `INVALID_LOCATION`, `LOCATION_UNSUPPORTED_FOR_TYPE`, `REGION_UNAVAILABLE`,
            `INVALID_API_CONFIG`, `INVALID_ASSERTION_PATTERN`, `unsafe_url` and `domain_not_found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Plan or role restriction: `LIMIT_EXCEEDED` (monitor or visual slot limit), `FEATURE_RESTRICTED`, `LOCATION_RESTRICTED`,
            `VISUAL_VIEWPORT_LIMIT`, or an API key without `monitors:write`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`DEPENDENCY_EXISTS`: that service is already monitored.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many monitors created in the last hour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Monitors
      summary: Bulk delete monitors
      description: Delete multiple monitors at once.
      operationId: bulkDeleteMonitors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Monitors deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  deletedCount:
                    type: integer
  /api/monitors/{id}:
    get:
      tags:
      - Monitors
      summary: Get monitor
      description: Get detailed information about a specific monitor.
      operationId: getMonitor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Monitor details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '404':
          description: Monitor not found
    put:
      tags:
      - Monitors
      summary: Update monitor
      description: 'Update a monitor. Every field is optional; send only what changes. Send `enabled: false` to pause and
        `enabled: true` to resume. `locations` and `visualRegion` move checks between regions (EU, US, ASIA).'
      operationId: updateMonitor
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMonitorRequest'
      responses:
        '200':
          description: Monitor updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Monitor'
        '400':
          description: Validation failed. Codes include `INVALID_LOCATION`, `LOCATION_UNSUPPORTED_FOR_TYPE`, `REGION_UNAVAILABLE`,
            `INVALID_API_CONFIG` and `INVALID_ASSERTION_PATTERN`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Plan or role restriction, for example `LOCATION_RESTRICTED` or `FEATURE_RESTRICTED`.
