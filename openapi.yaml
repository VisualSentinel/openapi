        '404':
          description: Monitor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`ASSERTIONS_CHANGED`: the stored response checks changed since `expectedAssertions` was read.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
