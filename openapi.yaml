      operationId: removeMonitorFromStatusPage
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: monitorId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Monitor removed
    patch:
      tags:
      - Status Pages
      summary: Update status page monitor display
      description: 'Change how a linked monitor appears on the status page: display name, which details are shown, position
        and group. Fields with the wrong type are ignored. Requires the Owner, Admin or Developer role.'
      operationId: updateStatusPageMonitor
      parameters:
      - name: id
        in: path
        required: true
        description: Status page ID
        schema:
          type: string
          format: uuid
      - name: monitorId
        in: path
        required: true
        description: Monitor ID (not the link ID)
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  description: Name shown on the status page. An empty string clears it so the monitor name is used.
                showGraph:
                  type: boolean
                  description: Show the uptime graph
                showResponseTime:
                  type: boolean
                  description: Show response time
                showSSL:
                  type: boolean
                  description: Show SSL certificate status
                order:
                  type: integer
                  description: Display position
                groupId:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: Group on this status page to place the monitor in, or null to ungroup it. A group with a tag
                    rule releases monitors that do not carry its tag on its next sync.
      responses:
        '200':
          description: Display options updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusPageMonitor:
                    $ref: '#/components/schemas/StatusPageMonitorLink'
        '403':
          description: Caller does not have the Owner, Admin or Developer role, or the seat is paused by the plan (code `SEAT_PAUSED_BY_PLAN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Status page not found, the monitor is not on this status page (`Monitor is not linked to this status
            page`), or `groupId` is not a group on this page (`Status page group not found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
