      operationId: listIncidents
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - resolved
          - all
          - INVESTIGATING
          - IDENTIFIED
          - MONITORING
          - RESOLVED
          - POSTMORTEM
          default: all
        description: '`active` returns open incidents (investigating, identified, monitoring); `resolved` returns resolved
          and postmortem ones; an exact status matches one status. Case-insensitive.'
      - name: severity
        in: query
        schema:
          type: string
          enum:
          - CRITICAL
          - HIGH
          - MEDIUM
          - LOW
          - INFO
