  /api/tools/domain-expiry:
    post:
      tags:
      - Free Tools
      summary: Domain expiry lookup (free, no auth)
      description: Looks up a domain registration's expiry date, registrar, registration date, and status locks via registry
        RDAP. Public endpoint, rate limited to 10 requests per 10 minutes per IP. Input must be a bare registrable domain
        (no scheme, path, or subdomain).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domain
              properties:
                domain:
                  type: string
                  example: example.com
      responses:
        '200':
          description: Lookup result
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    type: string
                  outcome:
                    type: string
                    enum:
                    - ok
                    - unsupported_tld
                    - lookup_failed
                    - not_found
                  expiresAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  daysRemaining:
                    type:
                    - integer
                    - 'null'
                  registeredAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  registrar:
                    type:
                    - string
                    - 'null'
                  domainStatuses:
                    type: array
                    items:
                      type: string
                  checkedAt:
                    type: string
                    format: date-time
        '400':
          description: Input is not a bare registrable domain
        '429':
          description: Rate limit exceeded (10 per 10 minutes per IP)
