  /api/status-pages/{id}/monitors:
    get:
      tags:
      - Status Pages
      summary: List monitors on status page
      description: List the monitors linked to a status page in display order, with each monitor's current status and its
        group assignment on this page.
      operationId: listStatusPageMonitors
      parameters:
      - name: id
        in: path
        required: true
        description: Status page ID
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Monitors on the status page, ordered by `order` ascending
          content:
            application/json:
              schema:
                type: object
                properties:
                  monitors:
                    type: array
                    items:
                      $ref: '#/components/schemas/StatusPageMonitorListItem'
        '404':
          description: Status page not found in the caller's organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Status Pages
      summary: Add monitors to status page
      description: Add one monitor (`monitorId`) or several (`monitorIds`, which takes precedence when non-empty) to the end
        of the status page's monitor order. New links start ungrouped with default display options; use the update endpoint
        to set a display name, group or order. Monitors outside the caller's organization are ignored and monitors already
        on the page are skipped. Requires the Owner, Admin or Developer role.
      operationId: addMonitorToStatusPage
      parameters:
      - name: id
        in: path
        required: true
        description: Status page ID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provide `monitorId` or a non-empty `monitorIds` array. Other fields are ignored.
              properties:
                monitorId:
                  type: string
                  format: uuid
                  description: A single monitor to add
                monitorIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Monitors to add in one request. Used instead of `monitorId` when non-empty.
      responses:
        '200':
          description: Monitors added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 3 monitor(s) added to status page
                  added:
                    type: integer
                    description: Number of requested monitors found in the organization, including any that were already on
                      the page and therefore skipped
        '400':
          description: Neither `monitorId` nor `monitorIds` provided (`Monitor ID is required`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller does not have the Owner, Admin or Developer role, or the seat is paused by the plan (code `SEAT_PAUSED_BY_PLAN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Status page not found, or none of the requested monitors belong to the caller's organization (`No valid
            monitors found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/status-pages/{id}/monitors/{monitorId}:
