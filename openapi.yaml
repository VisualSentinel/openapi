        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Alert rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleResponse'
    put:
      tags:
      - Alert Rules
      summary: Update alert rule
      description: Update an existing alert rule.
      operationId: updateAlertRule
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlertRuleRequest'
      responses:
        '200':
          description: Alert rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRuleResponse'
        '400':
          description: Validation failed, or the request uses a condition alert rules do not support (status_change, consecutive_failures,
            ssl_expiry). Those are covered by the built-in alerts.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AlertRuleConditionNotSupportedResponse'
                - $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Alert rule or monitor not found
    delete:
      tags:
      - Alert Rules
      summary: Delete alert rule
      description: Delete an alert rule.
      operationId: deleteAlertRule
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Alert rule deleted
