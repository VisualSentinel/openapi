          $ref: '#/components/schemas/AlertRule'
    CreateAlertRuleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        monitorId:
          default: null
          anyOf:
          - type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          - type: 'null'
        conditions:
          anyOf:
          - oneOf:
            - type: object
              properties:
                type:
                  type: string
                  const: response_time
                threshold:
                  type: number
                  exclusiveMinimum: 0
                  description: Response time in milliseconds to compare each successful check against.
                operator:
                  default: gt
                  type: string
                  enum:
                  - gt
                  - gte
                  - lt
                  - lte
                  - eq
              required:
              - type
              - threshold
            - type: object
              properties:
                type:
                  type: string
                  const: uptime
                threshold:
                  type: number
                  minimum: 0
                  maximum: 100
                  description: Uptime percentage to compare the monitor against.
                operator:
                  default: lt
                  type: string
                  enum:
                  - gt
                  - gte
                  - lt
                  - lte
              required:
              - type
              - threshold
          - minItems: 1
            type: array
            items:
              oneOf:
              - type: object
                properties:
                  type:
                    type: string
                    const: response_time
                  threshold:
                    type: number
                    exclusiveMinimum: 0
                    description: Response time in milliseconds to compare each successful check against.
                  operator:
                    default: gt
                    type: string
                    enum:
                    - gt
                    - gte
                    - lt
                    - lte
                    - eq
                required:
                - type
                - threshold
              - type: object
                properties:
                  type:
                    type: string
                    const: uptime
                  threshold:
                    type: number
                    minimum: 0
                    maximum: 100
                    description: Uptime percentage to compare the monitor against.
                  operator:
                    default: lt
                    type: string
                    enum:
                    - gt
                    - gte
                    - lt
                    - lte
                required:
                - type
                - threshold
          description: A response time or uptime condition, or a list of them that must all be true. Down alerts, repeated
            failures and SSL expiry are sent by the built-in alerts, so rules do not accept them.
        severity:
          default: WARNING
          type: string
          enum:
          - INFO
          - WARNING
          - CRITICAL
        cooldownMinutes:
          default: 5
          type: number
          exclusiveMinimum: 0
        notificationChannelIds:
          default: []
          type: array
          items:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        enabled:
          default: true
          type: boolean
        scheduleStart:
          anyOf:
          - type: string
            pattern: ^([01]\d|2[0-3]):[0-5]\d$
          - type: 'null'
        scheduleEnd:
          anyOf:
          - type: string
            pattern: ^([01]\d|2[0-3]):[0-5]\d$
          - type: 'null'
        timezone:
          default: UTC
          type: string
