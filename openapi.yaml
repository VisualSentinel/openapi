    AlertRule:
      type: object
      description: An alert rule. Rules watch one monitor and evaluate response time or uptime conditions on its checks.
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        monitorId:
          type:
          - string
          - 'null'
          format: uuid
          description: 'The monitor this rule watches. Older rules without a monitor never run (supported: false).'
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        enabled:
          type: boolean
        conditions:
          description: 'The conditions as stored: one condition object or a list that must all be true. See CreateAlertRuleRequest
            for the accepted shapes. Rules saved earlier with other condition types are returned as stored, with supported:
            false.'
        severity:
          type: string
          enum:
          - INFO
          - WARNING
          - CRITICAL
        threshold:
          type: integer
        window:
          type: integer
          description: Seconds.
        cooldownMinutes:
          type: integer
          description: Minimum minutes between two notifications from this rule.
        scheduleStart:
          type:
          - string
          - 'null'
          description: 24h HH:MM. With scheduleEnd, the rule only alerts inside this window.
        scheduleEnd:
          type:
          - string
          - 'null'
          description: 24h HH:MM.
        timezone:
          type: string
          description: IANA timezone for the schedule window.
        supported:
          type: boolean
          description: 'False when the rule can never run: it has no monitor, or a condition alert rules do not evaluate.
            Unsupported rules are never evaluated.'
        unsupportedReason:
          type:
          - string
          - 'null'
          description: Why the rule is not supported, in plain words. Null when supported.
        monitor:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            url:
              type: string
        notificationChannels:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              type:
                type: string
              enabled:
                type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
      - conditions
      - enabled
      - supported
      - unsupportedReason
