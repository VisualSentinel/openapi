        agentLastSeen:
          type:
          - string
          - 'null'
          format: date-time
        displayName:
          type:
          - string
          - 'null'
          description: Name shown on this status page
        showMetrics:
          type: boolean
        order:
          type: integer
          description: Display position on this status page
    StatusPageServerLink:
      type: object
      description: The link between a server and a status page, with its display options
      properties:
        id:
          type: string
          format: uuid
          description: Link ID
        statusPageId:
          type: string
          format: uuid
        serverId:
          type: string
          format: uuid
        displayName:
          type:
          - string
          - 'null'
        order:
          type: integer
        showMetrics:
          type: boolean
        createdAt:
          type: string
          format: date-time
    JsonValue:
      anyOf:
      - type: string
      - type: number
      - type: boolean
      - type: 'null'
