  /api/monitors/{id}/checks:
    get:
      tags:
      - Monitors
      summary: Get check history
      description: Get recent check results for a monitor with timing breakdown (DNS, connect, TLS, TTFB). Supports time range
        filtering and optional response body inclusion for API monitors.
      operationId: getMonitorChecks
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 500
        description: Number of checks to return
      - name: timeRange
        in: query
        schema:
          type: string
          enum:
          - 1h
          - 6h
          - 24h
          - 7d
          - 30d
          default: 24h
        description: Time range to fetch checks for
      - name: includeBody
        in: query
        schema:
          type: boolean
          default: false
        description: Include response body (API monitors only, increases payload size)
      responses:
        '200':
          description: Check history
          content:
            application/json:
              schema:
                type: object
                properties:
                  checks:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        status:
                          type: string
                          enum:
                          - SUCCESS
                          - FAILURE
                          - TIMEOUT
                          - ERROR
                        statusCode:
                          type:
                          - integer
                          - 'null'
                        responseTime:
                          type:
                          - number
                          - 'null'
                          description: Total response time in ms
                        location:
                          type:
                          - string
                          - 'null'
                          description: Checker source location for this result.
                        error:
                          type:
                          - string
                          - 'null'
                        createdAt:
                          type: string
                          format: date-time
                        assertionResults:
                          description: API assertion results if configured
                        responseBody:
                          type:
                          - string
                          - 'null'
                          description: Only included when includeBody=true
                        firstByteTime:
                          type:
                          - number
                          - 'null'
                          description: Time to first byte in ms
                        dnsTime:
                          type:
                          - number
                          - 'null'
                          description: DNS resolution time in ms
                        connectTime:
                          type:
                          - number
                          - 'null'
                          description: TCP connection time in ms
                        tlsTime:
                          type:
                          - number
                          - 'null'
                          description: TLS handshake time in ms
        '404':
          description: Monitor not found
        '503':
          description: Database unavailable
