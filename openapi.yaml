      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Shell script
          content:
            text/x-shellscript:
              schema:
                type: string
  /api/servers/agent/report:
    post:
      tags:
      - Servers
      summary: Agent metrics report
      description: Endpoint for the server agent to submit metrics data. Authenticated via server token.
      operationId: agentReport
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                cpu:
                  type: object
                memory:
                  type: object
                disk:
                  type: object
                network:
                  type: object
                processes:
                  type: array
      responses:
        '200':
