          maxItems: 10
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 365
          description: Days before certificate expiry to send reminders.
        reportEnabled:
          type: boolean
          description: Scheduled client report email for this monitor. Needs the Business plan or higher (403).
        reportEmail:
          type:
          - string
          - 'null'
          format: email
          description: Report recipient. An empty string or null clears it.
        reportFrequency:
          type: string
          enum:
          - weekly
          - biweekly
          - monthly
          - both
          - all
          description: Report schedule.
        reportIncludeCharts:
          type: boolean
          description: Include charts in the report.
        reportIncludeIncidents:
          type: boolean
          description: Include incidents in the report.
        alertThreshold:
          type: integer
          minimum: 1
          description: Consecutive failed checks before an alert is sent.
        alertDelay:
          type: integer
          minimum: 0
          description: Seconds to wait after the threshold is met before alerting.
        slowAlertThreshold:
          type: integer
          minimum: 1
          maximum: 10
          description: Consecutive slow responses before a slow-response alert.
        notificationRepeatInterval:
          type: integer
          minimum: 0
          maximum: 1440
          description: Minutes between repeat alerts while a problem continues. 0 sends one alert.
        expectedAssertions:
          type: array
          items:
            type: object
          description: 'Optional, sent with `apiConfig`: the response checks your change was based on, exactly as you read
            them from this monitor. If the stored checks have changed since, nothing is saved and the request answers 409
            with code `ASSERTIONS_CHANGED`. It cannot be combined with `enabled`, `visualEnabled` or `keywordConfig` (400);
            send those separately.'
