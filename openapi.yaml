  /api/incidents/{id}/context:
    get:
      tags:
      - Incidents
      summary: Get incident detail context
      description: 'Returns everything the incident detail view shows in one read: plain-language headline and summary, the
        checks around the incident, per-region results, the monitor''s settings, suggested fixes, alerts sent, status page
        preview, updates and related incidents. API keys need the `incidents:read` scope. The response is not cached.'
      operationId: getIncidentContext
      parameters:
      - name: id
        in: path
        required: true
        description: Incident ID.
        schema:
          type: string
          format: uuid
      - name: tz
        in: query
        required: false
        description: IANA time zone (for example `Europe/Berlin`) that decides where "today" starts for `uptimeToday`. Missing
          or unknown zones use UTC.
        schema:
          type: string
      responses:
        '200':
          description: Incident context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentContext'
        '401':
          description: Not signed in, or no valid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No membership in the organization, or the incident belongs to another organization you are a member
            of (`error` is `wrong_org`, with that organization's ID and name so the client can switch)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  organizationId:
                    type: string
                  organizationName:
                    type: string
        '404':
          description: Incident not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/alerts/deliveries:
    get:
      tags:
      - Alerts
      summary: List alert deliveries
      description: Lists the alerts sent for your monitors, grouped per alert event with the outcome for each channel, plus
        a seven-day summary. 50 events per page. Results may be up to 15 seconds old. API keys need the `alerts:read` scope.
      operationId: listAlertDeliveries
      parameters:
      - name: range
        in: query
        required: false
        description: '`today` starts at 00:00 UTC today; `7d` (the default, also used for any other value) starts six days
          before the current time.'
        schema:
          type: string
          enum:
          - today
          - 7d
          default: 7d
      - name: status
        in: query
        required: false
        description: '`not_sent` returns only channel deliveries that were not sent; any other value returns all.'
        schema:
          type: string
          enum:
          - all
          - not_sent
          default: all
      - name: page
        in: query
        required: false
        description: Page number. Values below 1 or not numeric are treated as 1.
        schema:
          type: integer
          minimum: 1
          default: 1
      responses:
        '200':
          description: Delivery log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDeliveryLog'
        '401':
          description: Not signed in, or no valid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/status-pages/{id}/groups:
    get:
      tags:
      - Status Pages
      summary: List status page groups
      description: List the component groups on a status page in display order, each with the number of monitors assigned
        to it.
      operationId: listStatusPageGroups
      parameters:
      - name: id
        in: path
        required: true
        description: Status page ID
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Groups on the status page, ordered by `order` ascending
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/StatusPageGroup'
                      - type: object
                        properties:
                          _count:
                            type: object
                            properties:
                              monitors:
                                type: integer
                                description: Number of linked monitors assigned to this group
        '404':
          description: Status page not found in the caller's organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Status Pages
      summary: Create status page group
      description: 'Create a component group at the end of the status page''s group order. When `tagRule` is set the group
        auto-syncs: every monitor in the organization carrying that tag is linked to the page (if not already) and placed
        in the group. Requires the Owner, Admin or Developer role.'
      operationId: createStatusPageGroup
      parameters:
      - name: id
        in: path
        required: true
        description: Status page ID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: Group name (trimmed). Must be unique within the status page.
                tagRule:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                  description: Monitor tag that drives automatic group membership (trimmed). Empty or null creates a manual
                    group with auto-sync off.
      responses:
        '201':
          description: Group created and, when it has a tag rule, synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  group:
                    $ref: '#/components/schemas/StatusPageGroup'
                  sync:
                    $ref: '#/components/schemas/StatusPageGroupSyncResult'
        '400':
          description: Invalid name or tag rule (`Enter a valid group name and tag`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller does not have the Owner, Admin or Developer role, the seat is paused by the plan (code `SEAT_PAUSED_BY_PLAN`),
            or the CSRF token is missing or invalid for a cookie session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Status page not found in the caller's organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/status-pages/{id}/groups/reorder:
    put:
      tags:
      - Status Pages
      summary: Reorder status page groups
      description: Replace the complete group order in one step. `groupIds` must list every group currently on the status
        page exactly once; the first ID gets order 1. Requires the Owner, Admin or Developer role.
      operationId: reorderStatusPageGroups
      parameters:
      - name: id
        in: path
        required: true
        description: Status page ID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - groupIds
              properties:
                groupIds:
                  type: array
                  maxItems: 200
                  uniqueItems: true
                  description: Every group ID on the status page, in the new display order
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Order saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupIds:
                    type: array
                    items:
                      type: string
                      format: uuid
        '400':
          description: Invalid body or duplicate IDs (`Invalid group order`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller does not have the Owner, Admin or Developer role, the seat is paused by the plan (code `SEAT_PAUSED_BY_PLAN`),
            or the CSRF token is missing or invalid for a cookie session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The submitted IDs do not match the page's current groups (`The groups changed. Refresh before reordering.`).
            Also returned when the status page does not exist in the caller's organization and the list is not empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/status-pages/{id}/groups/{groupId}:
    patch:
      tags:
      - Status Pages
      summary: Update status page group
      description: Rename a group or change its tag rule, then re-run the group's tag sync. Sending `tagRule` turns auto-sync
        on when the value is non-empty and off when it is empty or null; omitting it leaves auto-sync unchanged. Requires
