      responses:
        '200':
          description: Channel updated
    patch:
      tags:
      - Notification Channels
      summary: Toggle notification channel
      description: Enable or disable a notification channel.
      operationId: toggleNotificationChannel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Channel toggled
    delete:
      tags:
      - Notification Channels
      summary: Delete notification channel
      description: Delete a notification channel.
      operationId: deleteNotificationChannel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Channel deleted
  /api/notification-channels/{id}/test:
    post:
      tags:
      - Notification Channels
      summary: Test notification channel
      description: Send a test notification to verify the channel is configured correctly.
      operationId: testNotificationChannel
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Test notification sent. The test goes to every destination real alerts reach. When real alerts would
            not reach this channel, wouldReceiveAlerts is false and reason says why.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  sentAt:
                    type: string
                    format: date-time
                  wouldReceiveAlerts:
                    type: boolean
                  reason:
                    type:
                    - string
                    - 'null'
                    enum:
                    - disabled
                    - paused
                    - plan
                    - unverified
                    - null
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        target:
                          type: string
                        status:
                          type: string
                          enum:
                          - sent
                          - failed
                          - skipped
                        error:
                          type: string
                        reason:
                          type: string
                          enum:
                          - unverified
  /api/push-subscriptions:
    get:
      tags:
      - Notification Channels
      summary: List push subscriptions
      description: List all browser push notification subscriptions for the current organization.
      operationId: listPushSubscriptions
      responses:
        '200':
          description: Push subscriptions list
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      type: object
                      properties:
                        channelId:
                          type: string
                          format: uuid
                        channelName:
                          type: string
                        endpoint:
                          type: string
                          format: uri
                        name:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        userId:
                          type: string
                          format: uuid
    post:
      tags:
      - Notification Channels
      summary: Register push subscription
      description: Register a browser push notification subscription. Creates a new PUSH notification channel and auto-assigns
        it to all existing monitors. Requires write access and a plan that supports push notifications.
      operationId: createPushSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - subscription
              properties:
                subscription:
                  type: object
                  required:
                  - endpoint
                  - keys
                  properties:
                    endpoint:
                      type: string
                      format: uri
                    keys:
                      type: object
                      required:
                      - p256dh
                      - auth
                      properties:
                        p256dh:
                          type: string
                        auth:
                          type: string
                name:
                  type: string
                  maxLength: 100
                  description: Optional friendly name for this browser
      responses:
        '201':
          description: Push subscription registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  channelId:
                    type: string
                    format: uuid
        '400':
          description: Validation error
        '403':
          description: Push notifications not available on current plan
    delete:
      tags:
      - Notification Channels
      summary: Remove push subscription
      description: Remove a browser push subscription by endpoint URL. If it is the last subscription in its channel, the
        entire channel is deleted.
      operationId: deletePushSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - endpoint
              properties:
                endpoint:
                  type: string
                  format: uri
                  description: The push subscription endpoint URL to remove
      responses:
        '200':
          description: Push subscription removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Validation error
        '404':
          description: Subscription not found
  /api/notification-preferences:
    get:
      tags:
