  /api/monitors/bulk-alerts:
    put:
      tags:
      - Monitors
      summary: Bulk update monitor alerts
      description: Changes alert settings and notification channels on up to 2,000 monitors in one all-or-nothing change.
        Every monitor and channel must belong to your organization, or nothing changes. Any role except Viewer; API keys need
        the `monitors:write` scope. Limited to 30 requests per minute per organization.
      operationId: bulkUpdateAlerts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateAlertsRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedCount:
                    type: integer
                    description: Monitors whose alert fields were updated, or the number of IDs sent when `updates` changed
                      no fields.
        '400':
          description: Fails validation (`details` holds `formErrors` and `fieldErrors`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not signed in, or no valid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Viewer role, paused seat (code `SEAT_PAUSED_BY_PLAN`), missing or invalid CSRF token, the API key lacks
            the `monitors:write` scope or plan API access, a monitor ID is not in your organization or repeats, or a channel
            ID is not in your organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: More than 30 requests in a minute to this bulk route for the organization
          headers:
            Retry-After:
              description: Seconds until the window resets.
              schema:
                type: integer
            X-RateLimit-Limit:
              schema:
                type: integer
            X-RateLimit-Remaining:
              schema:
                type: integer
            X-RateLimit-Reset:
              description: ISO time the window resets.
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorBulkRateLimitError'
