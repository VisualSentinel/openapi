              schema:
                type: object
                properties:
                  maintenanceWindow:
                    $ref: '#/components/schemas/MaintenanceWindow'
                  message:
                    type: string
        '400':
          description: '`title`, `startTime` or `endTime` missing or invalid, end not after start, longer than 90 days, or
            an unknown `recurrenceKind`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Read-only role or an API key without `maintenance:write`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
