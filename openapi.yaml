  /api/dependencies:
    get:
      tags:
      - Monitors
      summary: List service dependencies
      description: The catalog of third-party services you can monitor as dependencies, each with your workspace's monitor
        for it when you have one. API keys need the `monitors:read` scope.
      operationId: listServiceDependencies
      responses:
        '200':
          description: Service catalog with your monitors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceDependencyCatalog'
        '401':
          description: Not signed in, or no valid API key
        '403':
          description: The key lacks the monitors:read scope, or the plan does not include API access
        '500':
          description: The catalog could not be loaded
  /api/dependencies/{slug}:
    get:
      tags:
      - Monitors
      summary: Get a service's provider status
      description: 'What the service''s provider reports on its own status page right now: overall state, each part (component),
        open incidents and scheduled maintenance. When the provider publishes no feed we can read, `available` is false and
        `statusUrl` still links to its public status page. API keys need the `monitors:read` scope.'
      operationId: getServiceDependencyStatus
      parameters:
      - name: slug
        in: path
        required: true
        description: Service slug from GET /api/dependencies, e.g. `github`.
        schema:
          type: string
      responses:
        '200':
          description: Provider status, or why there is none
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ServiceDependencyStatus'
                - $ref: '#/components/schemas/ServiceDependencyNoFeed'
        '401':
          description: Not signed in, or no valid API key
        '403':
          description: The key lacks the monitors:read scope, or the plan does not include API access
        '404':
          description: Unknown service
        '502':
          description: The provider's status feed is not answering right now
    patch:
      tags:
      - Monitors
      summary: Choose the parts a service monitor follows
      description: Sets which of the provider's parts (components) your monitor for this service alerts on. An empty list
        follows everything the provider reports. The monitor must exist (start monitoring the service first) and the provider
        must publish a status feed. Requires a role that can change monitors; API keys need the `monitors:write` scope.
      operationId: updateServiceDependencyComponents
      parameters:
      - name: slug
        in: path
        required: true
        description: Service slug from GET /api/dependencies, e.g. `github`.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceDependencyComponentsRequest'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateServiceDependencyComponentsResponse'
        '400':
          description: Invalid selection, or the service has no status feed to follow parts of
        '401':
          description: Not signed in, or no valid API key
        '403':
          description: Your role cannot change monitors, the key lacks the monitors:write scope, or the plan does not include
            API access
        '404':
          description: Unknown service, or no monitor for it in this workspace yet
        '409':
          description: One or more of the parts are no longer listed by the provider
        '502':
          description: The provider's status feed is not answering right now
  /api/monitoring/regions:
    get:
      tags:
      - Monitors
      summary: Check region availability
      description: 'Whether this workspace can use the Asia Pacific (ASIA) region for uptime `locations` and `visualRegion`.
        Use ASIA only when both `apac.available` and `apacAllowed` are true; otherwise monitor create and update with ASIA
        return 400 `REGION_UNAVAILABLE` (or 403 `LOCATION_RESTRICTED` when the plan excludes it). EU and US do not depend
        on this check. API key scope: `monitors:read`.'
      operationId: getMonitoringRegions
      responses:
        '200':
          description: Region availability
          content:
            application/json:
              schema:
                type: object
                required:
                - apac
                - apacAllowed
                properties:
                  apac:
                    type: object
                    required:
                    - available
                    - label
                    properties:
                      available:
                        type: boolean
                        description: A healthy Asia Pacific check node is online.
                      label:
                        type: string
                        description: Display name of the region.
                  apacAllowed:
                    type: boolean
                    description: This workspace is enabled for Asia Pacific and its plan allows the region.
        '403':
          description: No organization membership, or an API key without `monitors:read`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/maintenance/{id}/cancel:
    post:
      tags:
      - Maintenance
      summary: Cancel maintenance window
      description: 'Cancel a window. For a repeating window, `action: "skip-next"` skips one occurrence (the next one, or
        `occurrence`) and `action: "stop-repeating"` turns it into a one-off; without an action the whole window is cancelled.'
      operationId: cancelMaintenanceWindow
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - skip-next
                  - stop-repeating
                occurrence:
                  type: string
                  format: date-time
                  description: 'With `skip-next`: the future occurrence start to skip.'
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: No next occurrence to skip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Maintenance window not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/incidents/{id}/updates:
    post:
      tags:
      - Incidents
      summary: Post incident update
      description: Post a status update on an incident. It shows on the incident page and on every status page that shows
        this incident, and the incident status changes to match. Needs the owner or admin role.
      operationId: createIncidentUpdate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              - message
              properties:
                status:
                  type: string
                  enum:
                  - INVESTIGATING
                  - IDENTIFIED
                  - MONITORING
                  - RESOLVED
                  - POSTMORTEM
                  description: Case-insensitive.
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '201':
          description: Update posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  message:
                    type: string
                  authorId:
                    type:
                    - string
                    - 'null'
                  author:
                    type:
                    - object
                    - 'null'
                    properties:
                      id:
                        type: string
                      name:
                        type:
                        - string
                        - 'null'
                      email:
                        type: string
                  createdAt:
                    type: string
                    format: date-time
        '400':
          description: Missing or invalid status or message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not an owner or admin, or an API key without `incidents:write`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Incident not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/monitors/{id}/mute:
    post:
      tags:
      - Monitors
      summary: Mute a monitor's alerts
      description: Stops this monitor's alerts from going to any notification channel for the chosen duration. Checks keep
        running, incidents still open and close, alerts still appear in the dashboard, and possible-malware alerts are always
        sent; a new request replaces the current end time. Requires the Owner, Admin or Developer role; API keys need the
        `monitors:write` scope.
      operationId: muteMonitorAlerts
      parameters:
      - name: id
        in: path
        required: true
        description: Monitor ID.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorAlertMuteRequest'
      responses:
        '200':
          description: Muted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorAlertMuteResponse'
        '400':
          description: Body is not JSON, or `durationMinutes` is not 60, 480, 1440 or 10080 (the response then lists `allowedDurationMinutes`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  allowedDurationMinutes:
                    type: array
                    items:
                      type: integer
        '401':
          description: Not signed in, or no valid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Viewer or Member role, paused seat (code `SEAT_PAUSED_BY_PLAN`), missing or invalid CSRF token, no
            membership in the organization, or the API key lacks the `monitors:write` scope or plan API access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Monitor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Monitors
      summary: Unmute a monitor's alerts
      description: Ends the monitor's alert mute at once. Alerts held back during the mute are not sent afterwards; a problem
        that is still going alerts again at its next reminder. Succeeds when the monitor is not muted. Requires the Owner,
        Admin or Developer role; API keys need the `monitors:write` scope.
      operationId: unmuteMonitorAlerts
      parameters:
      - name: id
        in: path
        required: true
        description: Monitor ID.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Unmuted (`alertsMutedUntil` is null)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorAlertMuteResponse'
        '401':
          description: Not signed in, or no valid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Viewer or Member role, paused seat (code `SEAT_PAUSED_BY_PLAN`), missing or invalid CSRF token, no
            membership in the organization, or the API key lacks the `monitors:write` scope or plan API access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Monitor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/monitors/{id}/resolve:
    post:
      tags:
      - Monitors
      summary: Match a monitor to your servers
      description: Looks up the addresses the monitor's URL points to now (with origin addresses behind Cloudflare when a
        Cloudflare integration is connected), saves them on the monitor, and records matching servers as suggestions. Dismissed
        and manual links are never changed; automatic links can be confirmed, moved, or returned to a suggestion when the
        site's address changed. Takes no body. Any role except Viewer; API keys need the `monitors:write` scope.
      operationId: resolveMonitorServers
      parameters:
      - name: id
        in: path
        required: true
        description: Monitor ID.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Lookup done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorServerResolveResponse'
        '401':
          description: Not signed in, or no valid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Viewer role, paused seat (code `SEAT_PAUSED_BY_PLAN`), missing or invalid CSRF token, or the API key
            lacks the `monitors:write` scope or plan API access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Monitor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/monitors/{id}/servers:
    get:
      tags:
      - Monitors
      summary: List servers linked to a monitor
      description: Returns the servers confirmed as hosting this monitor's site, the automatic matches waiting for a decision,
        and the addresses from the last lookup. Dismissed links are not returned. API keys need the `monitors:read` scope.
      operationId: listMonitorServers
      parameters:
      - name: id
        in: path
        required: true
        description: Monitor ID.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Linked servers and suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorServerListResponse'
        '401':
          description: Not signed in, or no valid API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Monitor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Monitors
      summary: Link a server to a monitor
      description: Records that the monitor's site runs on this server, as a confirmed manual link. An existing suggested
        or dismissed link to the same server becomes a confirmed manual link. Any role except Viewer; API keys need the `monitors:write`
        scope.
      operationId: linkMonitorServer
      parameters:
      - name: id
        in: path
        required: true
        description: Monitor ID.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - serverId
              properties:
                serverId:
                  type: string
