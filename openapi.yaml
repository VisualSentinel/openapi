                    format: date-time
                  region:
                    type: string
                  regionLabel:
                    type: string
                  ok:
                    type: boolean
                  regionalOnly:
                    type: boolean
                  statusCode:
                    type:
                    - integer
                    - 'null'
                  result:
                    type: string
                  error:
                    type:
                    - string
                    - 'null'
                  errorCode:
                    type:
                    - string
                    - 'null'
                  responseTimeMs:
                    type:
                    - number
                    - 'null'
            omitted:
              type: integer
        certificate:
          type:
          - object
          - 'null'
          properties:
            validFrom:
              type: string
              format: date-time
            validTo:
              type: string
              format: date-time
            daysRemaining:
              type: integer
            issuer:
              type: string
            subject:
              type: string
            algorithm:
              type: string
            keySize:
              type: integer
            altNames:
              type: array
              items:
                type: string
        visualDiff:
          type:
          - object
          - 'null'
          description: Before and after screenshots recorded with a visual incident.
          properties:
            a:
              type: string
              description: Baseline image path.
            b:
              type: string
              description: Capture image path.
            diff:
              type:
              - string
              - 'null'
            percent:
              type: number
            threshold:
              type:
              - number
              - 'null'
            screenshotId:
              type: string
            visualTargetId:
              type:
              - string
              - 'null'
            viewport:
              type:
              - string
              - 'null'
              enum:
              - DESKTOP
              - MOBILE
              - null
            targetLabel:
              type:
              - string
              - 'null'
            exact:
              type: boolean
              enum:
              - true
        checksInRow:
          type: object
          properties:
            count:
              type: integer
            atLeast:
              type: boolean
              description: True when the stored log is cut short, so the real count may be higher.
        uptimeToday:
          type:
          - object
          - 'null'
          description: The monitor's day so far in the `tz` time zone (UTC when not given or not valid).
          properties:
            percent:
              type:
              - number
              - 'null'
            downSeconds:
              type: integer
            since:
              type: string
              format: date-time
            slots:
              type: array
              items:
                type: string
                enum:
                - ok
                - bad
                - none
        sentEvents:
          type: array
          description: Alerts that went out, one per event.
          items:
            type: object
            properties:
              event:
                type: string
                enum:
                - opened
                - reminder
                - recovered
              at:
                type: string
                format: date-time
              sent:
                type: integer
              failed:
                type: integer
              pending:
                type: integer
              total:
                type: integer
        earlierOnMonitor:
          type: array
          description: Up to three earlier resolved incidents of the same monitor.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              source:
                type: string
              startedAt:
                type: string
                format: date-time
              durationMs:
                type: integer
              checkType:
                type: string
        publicPreview:
          type:
          - object
          - 'null'
          description: What the first public status page showing this monitor says right now.
          properties:
            statusPage:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                name:
                  type: string
                slug:
                  type: string
                host:
                  type:
                  - string
                  - 'null'
            services:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  state:
                    type: string
                    enum:
                    - ok
                    - degraded
                    - problem
                    - maintenance
            incident:
              type:
              - object
              - 'null'
              properties:
                title:
                  type: string
                status:
                  type: string
                message:
                  type:
                  - string
                  - 'null'
                at:
                  type: string
                  format: date-time
        statusPages:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
        deliveries:
          type:
          - array
          - 'null'
          description: Who was told, per channel, oldest first. Empty for incidents from before delivery records existed;
            null when the record could not be read.
          items:
            type: object
            properties:
              event:
                type: string
                enum:
                - opened
                - reminder
                - recovered
                - other
              channelId:
                type:
                - string
                - 'null'
                format: uuid
              channelName:
                type: string
              channelType:
                type: string
                description: Channel type such as EMAIL or SLACK, or ALL for an outcome that applied to every channel.
              status:
                type: string
                enum:
                - sent
                - not_sent
                - pending
              reason:
                type:
                - string
                - 'null'
                description: Plain-language reason when not sent or still pending.
              at:
                type: string
                format: date-time
        updates:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              status:
                type: string
              message:
                type: string
              authorName:
                type:
                - string
                - 'null'
              system:
                type: boolean
              createdAt:
                type: string
                format: date-time
        muteEvents:
          type: array
          description: Alert mutes and unmutes of the monitor while the incident was open, oldest first.
          items:
            type: object
            properties:
              at:
                type: string
                format: date-time
              kind:
                type: string
                enum:
                - muted
                - unmuted
              byName:
                type:
                - string
                - 'null'
              until:
                type:
                - string
                - 'null'
                format: date-time
                description: End of the mute, for `muted`.
        related:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              state:
                type: string
                enum:
                - ongoing
                - acknowledged
                - resolved
              startedAt:
                type: string
                format: date-time
              resolvedAt:
                type:
                - string
                - 'null'
                format: date-time
        cluster:
          type:
          - object
          - 'null'
          description: 'Present only for incidents tied to a server: the monitors on that server it affects and its child
            incidents. Null otherwise.'
          additionalProperties: true
          properties:
            affectedMonitors:
              type: array
              items:
                type: object
                additionalProperties: true
            clusterRollup:
              type:
              - object
              - 'null'
              additionalProperties: true
            separateOpenIssues:
              type: array
              items:
                type: object
                additionalProperties: true
            childIncidents:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  title:
                    type: string
                  status:
                    type: string
                  severity:
                    type: string
                  monitorId:
                    type:
                    - string
                    - 'null'
                    format: uuid
                  monitor:
                    type:
                    - object
                    - 'null'
                    properties:
                      name:
                        type: string
                      url:
                        type: string
                      status:
                        type: string
            parentIncident:
              type:
              - object
              - 'null'
              properties:
                id:
                  type: string
                  format: uuid
                title:
                  type: string
                status:
                  type: string
        viewer:
          type: object
          properties:
            canEdit:
              type: boolean
              description: Owner, Admin or Developer.
            canPostStatusUpdate:
              type: boolean
              description: Owner or Admin.
    AlertDeliveryLog:
      type: object
      properties:
        rows:
          type: array
          description: Alert events, newest first, 50 per page.
          items:
            $ref: '#/components/schemas/AlertDeliveryLogEvent'
        summary:
          type: object
          properties:
            total:
              type: integer
              description: Alert events in the range (after the `status` filter).
            failed:
              type: integer
              description: Channel deliveries not sent, for any reason (including mutes and pauses).
            perDay:
              type: array
              description: Always seven UTC days ending today, counted from the rows the range and `status` filter selected.
              items:
                type: object
                properties:
                  day:
                    type: string
                    format: date
                  sent:
                    type: integer
                    description: Alert events with at least one channel delivery sent that day.
                  failed:
                    type: integer
                    description: Channel deliveries the channel did not accept (reason `failed`) that day.
        page:
          type: integer
        totalPages:
          type: integer
          description: At least 1.
    AlertDeliveryLogEvent:
      type: object
      properties:
        at:
          type: string
          format: date-time
          description: Time of the newest delivery record for the event.
        monitorName:
          type: string
        incidentId:
          type:
          - string
          - 'null'
          format: uuid
        event:
          type: string
          enum:
          - opened
          - reminder
          - recovered
          - other
        alertType:
          type: string
          description: For example DOWN, RECOVERY, SSL_EXPIRING or VISUAL_CHANGE.
        channels:
          type: array
          items:
            type: object
            properties:
              channelId:
                type:
                - string
                - 'null'
                format: uuid
                description: Null for an outcome that applied to every channel.
              name:
                type: string
                description: Channel name, or the channel type when the channel no longer exists or the outcome applied to
                  every channel (`ALL`).
              type:
                type: string
              status:
                type: string
                enum:
                - sent
                - not_sent
              reason:
                type:
                - string
                - 'null'
                enum:
                - failed
                - unverified_email
                - no_recipients
                - unsupported
                - rate_limited
                - muted
                - org_paused
                - no_channels
                - null
                description: Set for `not_sent` only.
    StatusPageGroup:
      type: object
      description: A named group of components on a status page
      properties:
        id:
          type: string
          format: uuid
        statusPageId:
          type: string
          format: uuid
        name:
          type: string
        order:
          type: integer
          description: Display position, starting at 1
        tagRule:
          type:
          - string
          - 'null'
          description: Monitor tag that drives automatic membership, or null for a manual group
        autoSync:
          type: boolean
          description: True when the group's membership follows its tag rule
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StatusPageGroupSyncResult:
      type: object
      description: What the tag sync changed. All zero for a group without a tag rule.
      properties:
        linked:
          type: integer
          description: Monitors with the tag that were added to the status page in this group
        assigned:
          type: integer
          description: Monitors already on the page, ungrouped and carrying the tag, that were moved into this group
        released:
          type: integer
          description: Monitors in this group without the tag that were moved out of the group (they stay on the page)
    StatusPageMonitorListItem:
      type: object
      description: A monitor linked to a status page, as returned by the list endpoint
      properties:
        id:
          type: string
          format: uuid
          description: Monitor ID
        name:
          type: string
        url:
          type: string
        status:
          $ref: '#/components/schemas/MonitorStatus'
        uptimePercent:
          type: number
        type:
          $ref: '#/components/schemas/StoredMonitorType'
        lastCheckedAt:
          type:
          - string
          - 'null'
          format: date-time
        order:
          type: integer
          description: Display position on this status page
        groupId:
          type:
          - string
          - 'null'
          format: uuid
          description: Group on this status page, or null when ungrouped
    StatusPageMonitorLink:
      type: object
      description: The link between a monitor and a status page, with its display options
      properties:
        id:
          type: string
          format: uuid
          description: Link ID
        statusPageId:
          type: string
          format: uuid
        monitorId:
          type: string
          format: uuid
        groupId:
          type:
          - string
          - 'null'
          format: uuid
        displayName:
          type:
          - string
          - 'null'
        order:
          type: integer
        showGraph:
          type: boolean
        showResponseTime:
          type: boolean
        showSSL:
          type: boolean
        createdAt:
          type: string
          format: date-time
    StatusPageServerListItem:
      type: object
      description: A server linked to a status page, as returned by the list endpoint
