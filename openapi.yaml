    post:
      tags:
      - API Keys
      summary: Create API key
      description: Generate a new API key for programmatic access. Requires Business plan or higher.
      operationId: createApiKey
      security:
      - SessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - scopes
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                scopes:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: Required. At least one scope, e.g. monitors:read, servers:write, * etc.
                expiresAt:
                  type: string
                  format: date-time
                  description: ISO 8601 expiry timestamp (preferred). Takes precedence over expiresIn.
                expiresIn:
                  type: integer
                  minimum: 1
                  description: 'Legacy alternative to expiresAt: number of days until the key expires. Used only when expiresAt
                    is omitted.'
      responses:
        '201':
          description: API key created (key shown only once)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiKey'
                - type: object
                  properties:
                    key:
                      type: string
                      description: The actual API key value (shown only once)
