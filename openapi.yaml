        '401':
          description: Invalid server token
  /api/notification-channels:
    get:
      tags:
      - Notification Channels
      summary: List notification channels
      description: Get all notification channels for the organization.
      operationId: listNotificationChannels
      responses:
        '200':
          description: List of notification channels
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationChannel'
    post:
      tags:
      - Notification Channels
      summary: Create notification channel
      description: Create a notification channel. Channel types available depend on the plan (403 `PLAN_LIMIT_EXCEEDED`).
      operationId: createNotificationChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationChannelRequest'
      responses:
        '201':
          description: Channel created
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel:
                    $ref: '#/components/schemas/NotificationChannel'
        '400':
          description: Validation failed or required settings missing for the channel type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Channel type not on your plan (`PLAN_LIMIT_EXCEEDED`), read-only role, or an API key without `channels:write`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/notification-channels/{id}:
    get:
      tags:
      - Notification Channels
      summary: Get notification channel
