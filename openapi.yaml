      parameters:
      - name: id
        in: path
        required: true
        description: Status page ID
        schema:
          type: string
          format: uuid
      - name: groupId
        in: path
        required: true
        description: Group ID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                  description: New group name (trimmed). Must be unique within the status page.
                tagRule:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                  description: Monitor tag that drives automatic group membership (trimmed). Empty or null turns auto-sync
                    off.
      responses:
        '200':
          description: Group updated and synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  group:
                    $ref: '#/components/schemas/StatusPageGroup'
                  sync:
                    $ref: '#/components/schemas/StatusPageGroupSyncResult'
        '400':
          description: Invalid body (`Invalid group settings`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller does not have the Owner, Admin or Developer role, the seat is paused by the plan (code `SEAT_PAUSED_BY_PLAN`),
            or the CSRF token is missing or invalid for a cookie session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found on this status page in the caller's organization (`Status page group not found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Status Pages
      summary: Delete status page group
      description: Delete a group. Monitors in the group stay on the status page and become ungrouped. Requires the Owner,
        Admin or Developer role.
      operationId: deleteStatusPageGroup
      parameters:
      - name: id
        in: path
        required: true
        description: Status page ID
        schema:
          type: string
          format: uuid
      - name: groupId
        in: path
        required: true
        description: Group ID
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Group deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Status page group deleted
        '403':
          description: Caller does not have the Owner, Admin or Developer role, the seat is paused by the plan (code `SEAT_PAUSED_BY_PLAN`),
            or the CSRF token is missing or invalid for a cookie session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Group not found on this status page in the caller's organization (`Status page group not found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/status-pages/{id}/servers:
    get:
      tags:
      - Status Pages
      summary: List servers on status page
      description: List the servers shown on a status page in display order, with their current status, latest metrics and
        per-page display options.
      operationId: listStatusPageServers
      parameters:
      - name: id
        in: path
        required: true
        description: Status page ID
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Servers on the status page, ordered by `order` ascending
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items:
                      $ref: '#/components/schemas/StatusPageServerListItem'
        '404':
          description: Status page not found in the caller's organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Status Pages
      summary: Add servers to status page
      description: Add one server (`serverId`) or several (`serverIds`, which takes precedence when non-empty) to the end
        of the status page's server order. Servers outside the caller's organization are ignored and servers already on the
        page are skipped. Requires the Owner, Admin or Developer role.
      operationId: addServerToStatusPage
      parameters:
      - name: id
        in: path
        required: true
        description: Status page ID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provide `serverId` or a non-empty `serverIds` array.
              properties:
                serverId:
                  type: string
                  format: uuid
                  description: A single server to add
                serverIds:
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Servers to add in one request. Used instead of `serverId` when non-empty.
      responses:
        '200':
          description: Servers added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 2 server(s) added to status page
                  added:
                    type: integer
                    description: Number of requested servers found in the organization, including any that were already on
                      the page and therefore skipped
        '400':
          description: Neither `serverId` nor `serverIds` provided (`Server ID is required`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller does not have the Owner, Admin or Developer role, or the seat is paused by the plan (code `SEAT_PAUSED_BY_PLAN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Status page not found, or none of the requested servers belong to the caller's organization (`No valid
            servers found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/status-pages/{id}/servers/{serverId}:
    patch:
      tags:
      - Status Pages
      summary: Update status page server display
      description: Change how a linked server appears on the status page. Fields with the wrong type are ignored. Requires
        the Owner, Admin or Developer role.
      operationId: updateStatusPageServer
      parameters:
      - name: id
        in: path
        required: true
        description: Status page ID
        schema:
          type: string
          format: uuid
      - name: serverId
        in: path
        required: true
        description: Server ID (not the link ID)
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  description: Name shown on the status page. An empty string clears it so the server name is used.
                showMetrics:
                  type: boolean
                  description: Show CPU, memory and disk metrics on the status page
                order:
                  type: integer
                  description: Display position
      responses:
        '200':
          description: Display options updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusPageServer:
                    $ref: '#/components/schemas/StatusPageServerLink'
        '403':
          description: Caller does not have the Owner, Admin or Developer role, or the seat is paused by the plan (code `SEAT_PAUSED_BY_PLAN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Status page not found, or the server is not on this status page (`Server is not linked to this status
            page`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Status Pages
      summary: Remove server from status page
      description: Remove a server from the status page and renumber the remaining servers from 1. The server itself is not
        deleted. Requires the Owner, Admin or Developer role.
      operationId: removeServerFromStatusPage
      parameters:
      - name: id
        in: path
        required: true
        description: Status page ID
        schema:
          type: string
          format: uuid
      - name: serverId
        in: path
        required: true
        description: Server ID (not the link ID)
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Server removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Server removed from status page
        '403':
          description: Caller does not have the Owner, Admin or Developer role, or the seat is paused by the plan (code `SEAT_PAUSED_BY_PLAN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Status page not found, or the server is not on this status page (`Server is not linked to this status
            page`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/status-pages/{id}/monitors/reorder:
    put:
      tags:
      - Status Pages
      summary: Reorder status page monitors
      description: Replace the complete monitor order in one step. `monitorIds` must list every monitor currently linked to
        the status page exactly once; the first ID gets order 1. Group assignments are not changed. Requires the Owner, Admin
        or Developer role.
      operationId: reorderStatusPageMonitors
      parameters:
      - name: id
        in: path
        required: true
        description: Status page ID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - monitorIds
              properties:
                monitorIds:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  uniqueItems: true
                  description: Every monitor ID linked to the status page (monitor IDs, not link IDs), in the new display
                    order
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Order saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  monitorIds:
                    type: array
                    items:
                      type: string
                      format: uuid
        '400':
          description: Invalid body (`Invalid monitor order`) or duplicate IDs (`Monitor order contains duplicates`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller does not have the Owner, Admin or Developer role, the seat is paused by the plan (code `SEAT_PAUSED_BY_PLAN`),
            or the CSRF token is missing or invalid for a cookie session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Status page not found in the caller's organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The submitted IDs do not match the monitors currently linked to the page (`The linked monitors changed.
            Refresh before reordering.`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/status-pages/{id}/logo:
    post:
      tags:
      - Status Pages
      summary: Upload status page logo
      description: Upload the status page logo, or the dark-theme logo with `?variant=dark`, replacing the current one. Accepts
        PNG, JPEG, WebP, GIF or SVG up to 2 MB; SVG files are sanitized and must be well-formed. Requires the white-label
        feature (Agency plan) and the Owner or Admin role.
      operationId: uploadStatusPageLogo
      parameters:
      - name: id
        in: path
        required: true
        description: Status page ID
        schema:
          type: string
          format: uuid
      - name: variant
        in: query
        required: false
        description: '`dark` sets the dark-theme logo. Any other value or no value sets the standard logo.'
        schema:
          type: string
          enum:
          - dark
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 'Image file: PNG, JPEG, WebP, GIF or SVG, up to 2 MB. The file content must match its declared
                    type.'
      responses:
        '200':
          description: Logo uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  url:
                    type: string
                    description: Site-relative URL of the stored logo
                    example: /uploads/logos/example.png
        '400':
          description: No file provided, unsupported type or size (`PNG, JPG, WebP, GIF or SVG, up to 2 MB.`), content that
            does not match its type, or an SVG that fails validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The organization's plan does not include white-label branding (`Status page logos require the Agency
            plan.`), the caller is not an Owner or Admin, or the seat is paused by the plan (code `SEAT_PAUSED_BY_PLAN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Status page not found in the caller's organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Status Pages
      summary: Remove status page logo
      description: Clear the status page logo, or the dark-theme logo with `?variant=dark`. Requires the white-label feature
        (Agency plan) and the Owner or Admin role.
      operationId: deleteStatusPageLogo
      parameters:
      - name: id
        in: path
        required: true
        description: Status page ID
        schema:
          type: string
          format: uuid
      - name: variant
        in: query
        required: false
        description: '`dark` clears the dark-theme logo. Any other value or no value clears the standard logo.'
        schema:
          type: string
          enum:
          - dark
      responses:
        '200':
          description: Logo removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
        '403':
          description: The organization's plan does not include white-label branding (`Status page logos require the Agency
            plan.`), the caller is not an Owner or Admin, or the seat is paused by the plan (code `SEAT_PAUSED_BY_PLAN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Status page not found in the caller's organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/status-pages/{id}/favicon:
    post:
      tags:
      - Status Pages
      summary: Upload status page favicon
      description: 'Upload the status page favicon, replacing the current one. Accepts PNG, JPEG, WebP or GIF up to 2 MB (SVG
        and ICO are not accepted). To clear the favicon, update the status page with `favicon: null`. Requires the white-label
        feature (Agency plan) and the Owner or Admin role.'
      operationId: uploadStatusPageFavicon
      parameters:
      - name: id
        in: path
        required: true
        description: Status page ID
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 'Image file: PNG, JPEG, WebP or GIF, up to 2 MB. The file content must match its declared type.'
      responses:
        '200':
          description: Favicon uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    const: true
                  url:
                    type: string
                    description: Site-relative URL of the stored favicon
                    example: /uploads/logos/example-favicon.png
        '400':
          description: No file provided, unsupported type or size (`File must be a PNG, JPEG, WebP, or GIF under 2MB.`), or
            content that does not match its type (`File content does not match its type.`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The organization's plan does not include white-label branding (`Status page logos require the Agency
            plan.`), the caller is not an Owner or Admin, or the seat is paused by the plan (code `SEAT_PAUSED_BY_PLAN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Status page not found in the caller's organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie obtained from POST /api/auth/login
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: API key (vs_xxxxx). Can also be sent via X-API-Key header or api_key query parameter.
  schemas:
    ServiceDependencyCatalog:
      type: object
      required:
      - services
      properties:
        services:
          type: array
          items:
            type: object
            required:
            - slug
            - name
            - domain
            - statusUrl
            - monitor
            - intelligence
            properties:
              slug:
                type: string
              name:
                type: string
              domain:
                type: string
              statusUrl:
                type: string
                format: uri
                description: The service's public status page.
              statusSource:
                type: string
                enum:
                - official
                - community
                - support
              description:
                type: string
              category:
                type: string
              searchVolume:
                type: number
              monitor:
                description: Your workspace's monitor for this service; null when you do not monitor it.
                oneOf:
                - type: 'null'
                - type: object
                  properties:
                    id:
                      type: string
                    status:
                      type: string
                    enabled:
                      type: boolean
                    lastCheckedAt:
                      type:
                      - string
                      - 'null'
                      format: date-time
                    responseTime:
                      type:
                      - integer
                      - 'null'
                    componentIds:
                      type: array
                      items:
                        type: string
                      description: Parts the monitor follows; empty follows everything.
                    mode:
                      type: string
                      enum:
                      - provider-status
                      - endpoint
                      description: provider-status reads the provider's status feed; endpoint checks the service directly.
              intelligence:
                type: object
                properties:
                  available:
                    type: boolean
                  source:
                    type: string
                    enum:
                    - official-feed
                    - endpoint-only
    ServiceDependencyStatus:
      type: object
      required:
      - available
      - serviceName
      - statusUrl
      - status
      - components
      - incidents
      - maintenance
      properties:
        available:
          type: boolean
          const: true
        serviceName:
          type: string
          description: The service's name (the monitor itself is named "<Service> dependency").
        statusUrl:
          type: string
          format: uri
          description: The provider's public status page.
        source:
          type: string
          enum:
          - atlassian-statuspage
        apiUrl:
          type: string
          format: uri
          description: The feed this status was read from.
        status:
          type: string
          enum:
          - operational
          - maintenance
          - degraded
          - partial_outage
          - major_outage
          - unknown
        description:
          type: string
          description: The provider's own summary line.
        checkedAt:
          type: string
          format: date-time
        components:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              status:
                type: string
                enum:
                - operational
                - maintenance
                - degraded
                - partial_outage
                - major_outage
                - unknown
              groupId:
                type:
                - string
                - 'null'
              isGroup:
                type: boolean
                description: A group heading rather than a part; groups cannot be followed.
        incidents:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              status:
                type: string
                description: The provider's own wording, e.g. investigating, identified, monitoring, scheduled, in_progress.
              impact:
                type: string
              shortlink:
                type:
                - string
                - 'null'
                format: uri
                description: The event's own page; null when the provider gives none (link to `statusUrl` instead).
              updatedAt:
                type: string
                format: date-time
              componentIds:
                type: array
                items:
                  type: string
                description: Parts this event affects.
        maintenance:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              status:
                type: string
                description: The provider's own wording, e.g. investigating, identified, monitoring, scheduled, in_progress.
              impact:
                type: string
              shortlink:
                type:
                - string
                - 'null'
                format: uri
                description: The event's own page; null when the provider gives none (link to `statusUrl` instead).
              updatedAt:
                type: string
                format: date-time
              componentIds:
                type: array
                items:
                  type: string
                description: Parts this event affects.
              scheduledFor:
                type:
                - string
                - 'null'
                format: date-time
              scheduledUntil:
                type:
                - string
                - 'null'
                format: date-time
    ServiceDependencyNoFeed:
      type: object
      required:
      - available
      - serviceName
      - statusUrl
      - message
      properties:
        available:
          type: boolean
          const: false
        serviceName:
          type: string
        statusUrl:
          type: string
          format: uri
        message:
          type: string
    UpdateServiceDependencyComponentsRequest:
      type: object
      required:
      - componentIds
      properties:
        componentIds:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 100
          description: Part ids from GET /api/dependencies/{slug} (not groups). Empty follows everything the provider reports.
    UpdateServiceDependencyComponentsResponse:
      type: object
      properties:
        monitorId:
          type: string
        componentIds:
          type: array
          items:
            type: string
        monitor:
          type: object
          description: The monitor fields written by this save, for immediately updating the client cache.
          required:
          - url
          - type
          - method
          - expectedStatus
          - serviceDependencyComponents
          - apiConfig
          properties:
            url:
              type: string
              format: uri
            type:
              type: string
              enum:
              - API
            method:
              type: string
              enum:
              - GET
            expectedStatus:
              type: array
              items:
                type: integer
            serviceDependencyComponents:
              type: array
              items:
                type: string
            apiConfig:
              type: object
              additionalProperties: true
        mode:
          type: string
          enum:
          - provider-status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Readable message.
        code:
          type: string
          description: Stable machine-readable code when the endpoint sets one, for example `SCOPE_DENIED`, `REGION_UNAVAILABLE`
            or `LOCATION_RESTRICTED`.
        message:
          type: string
        details:
          description: Validation details when available.
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - healthy
          - unhealthy
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number
        version:
          type: string
        services:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                latency:
                  type: number
            redis:
              type: object
              properties:
                status:
                  type: string
                latency:
                  type: number
            worker:
              type: object
              properties:
                status:
                  type: string
                activeJobs:
                  type: number
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    RegisterRequest:
      type: object
      required:
      - name
      - email
      - password
      - acceptTerms
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          description: Must contain uppercase, lowercase, and number
        organizationName:
          type: string
          minLength: 2
          maxLength: 100
        acceptTerms:
          type: boolean
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        organization:
          $ref: '#/components/schemas/Organization'
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - OWNER
          - ADMIN
          - MEMBER
          - VIEWER
        createdAt:
          type: string
          format: date-time
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          enum:
          - FREE
          - STARTER
          - BUSINESS
          - AGENCY
          - CUSTOM
        monitorLimit:
          type: integer
          description: Effective organization-specific monitor allowance. CUSTOM organizations may exceed the standard Agency
            limit.
    MonitorType:
      type: string
      enum:
      - HTTP
      - HTTPS
      - TCP
      - UDP
      - DNS
      - SSL
      - PING
      - PORT
      - KEYWORD
      - API
      - GRAPHQL
      - WEBSOCKET
      description: 'Monitor types accepted when creating a monitor. Visual and content change detection are not separate types:
        turn them on with `visualEnabled` and `contentConfig` on an HTTP or HTTPS monitor.'
    MonitorStatus:
      type: string
      enum:
      - OPERATIONAL
      - DEGRADED
      - PARTIAL_OUTAGE
      - MAJOR_OUTAGE
      - UI_CHANGED
      - CONTENT_STALE
      - CONTENT_CHANGED
      - UNDER_MAINTENANCE
      - UNKNOWN
    MonitorResponseStatus:
      type: string
      enum:
      - operational
      - degraded
      - down
      - maintenance
      - ui-changed
      - content-changed
      - unknown
    HTTPMethod:
