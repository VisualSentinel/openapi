        in: query
        schema:
          type: string
          format: uuid
      - name: q
        in: query
        schema:
          type: string
          maxLength: 200
        description: Search title, description and cause.
      - name: startDate
        in: query
        schema:
          type: string
        description: ISO date or date-time.
      - name: endDate
        in: query
        schema:
          type: string
        description: ISO date or date-time.
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
        description: Values above 100 are served 100 rows.
